const readLn=()=>[...document.querySelectorAll('#ln .ln')].map(d=>{const p=prod(d.querySelector('select').value);return p&&{pid:p.id,q:+d.querySelector('.q').value,pr:+d.querySelector('.pr').value,cs:p.cost}}).filter(Boolean);
const lnBox=k=>`<div id="ln"></div><button type="button" class="b2 sm" onclick="addLn('${k}')">+ ${t('Add item')}</button>`;

const OST=['Pending','Confirmed','Processing','Shipped','Delivered','Cancelled','Returned'];
function sales(){const l=S.o.filter(s=>(s.no+cust(s.cid).n+cust(s.cid).ph).toLowerCase().includes(q.toLowerCase())).reverse();
return`<h1>${t('Sales')}<button onclick="saleForm()">+ ${t('New sale')}</button></h1>${sbox()}${tbl(['Date','Orders','Customers','Total','Due','Status',''],l.slice(0,lim).map(s=>{const c=cust(s.cid);return`<tr><td>${s.date.slice(5)}</td><td>${s.no}</td><td>${esc(c.n)}</td><td>${M(sTot(s))}</td><td class="${sTot(s)-s.paid>0?'neg':''}">${M(sTot(s)-s.paid)}</td><td><select onchange="setSt('${s.id}',this.value)" style="width:auto">${OST.map(o=>`<option value="${o}" ${o==s.st?'selected':''}>${t(o)}</option>`).join('')}</select></td><td><button class="b2 sm" onclick="invoice('${s.id}')">${t('Invoice')}</button></td></tr>`}))}${more(l.length)}`}
function saleForm(){if(!S.p.length){toast(t('Products')+' ?');return go('products')}
modal(`<h1>${t('New sale')}</h1>${inp('n','Name')}${inp('ph','Phone',{t:'tel'})}${inp('ad','Address')}${lnBox('s')}<div class="row" style="margin-top:8px">${inp('d','Discount',{t:'number',v:0})}${inp('dc','Delivery charge',{t:'number',v:0})}</div><div class="row">${sel('m','Method',MET,'Cash')}${sel('ps','Status',['Paid','Partial','Due'],'Paid')}</div>${inp('pd','Paid amount',{t:'number',v:0})}${sel('os','Status',OST,'Confirmed')}${inp('dt','Date',{t:'date',v:today()})}${btns('saveSale()')}`);addLn('s')}
function saveSale(){const it=readLn();if(!it.length||it.some(i=>!(i.q>0)||i.pr<0))return err('Add items with quantity');
const need={};for(const i of it){need[i.pid]=(need[i.pid]||0)+i.q}for(const id in need){const p=prod(id);if(p.stock<need[id])return err(p.n+': '+t('Not enough stock'))}
const nm=g('n');if(!nm||!g('dt'))return err('Required fields missing');
const d=gn('d'),dc=gn('dc'),tot=sum(it,i=>i.q*i.pr)-d+dc;if(tot<0)return err('Required fields missing');
const ph=g('ph');let c=S.c.find(x=>ph?x.ph==ph:x.n==nm);if(!c){c={id:uid(),n:nm,ph,ad:g('ad')};S.c.push(c)}else if(g('ad'))c.ad=g('ad');
const ps=g('ps'),paid=ps=='Paid'?tot:ps=='Due'?0:Math.min(gn('pd'),tot);
$('#sv').disabled=true;for(const id in need)prod(id).stock-=need[id];S.n++;
S.o.push({id:uid(),no:'ORD-'+String(S.n).padStart(4,'0'),date:g('dt'),cid:c.id,it,d,dc,paid,m:g('m'),st:g('os')});save();cm();toast(t('Saved'));render()}
function setSt(id,v){const s=S.o.find(x=>x.id==id),was=ok(s),now=!['Cancelled','Returned'].includes(v);
if(was&&!now)s.it.forEach(i=>prod(i.pid)&&(prod(i.pid).stock+=i.q));
if(!was&&now){if(s.it.some(i=>prod(i.pid)&&prod(i.pid).stock<i.q)){toast(t('Not enough stock'));return render()}s.it.forEach(i=>prod(i.pid)&&(prod(i.pid).stock-=i.q))}
s.st=v;save();render()}
function invoice(id){const s=S.o.find(x=>x.id==id),c=cust(s.cid);modal(`<div style="text-align:center"><b>${esc(S.set.name)}</b><br><small>${esc(S.set.ad)} ${esc(S.set.ph)}</small></div><p>${t('Invoice')}: <b>${s.no}</b> · ${s.date}<br>${esc(c.n)} ${esc(c.ph)}</p>${tbl(['Product','Qty','Price','Total'],s.it.map(i=>`<tr><td>${esc(prod(i.pid)?.n||'-')}</td><td>${N(i.q)}</td><td>${M(i.pr)}</td><td>${M(i.q*i.pr)}</td></tr>`))}<p style="text-align:right">${t('Discount')}: ${M(s.d)}<br>${t('Delivery charge')}: ${M(s.dc)}<br><b>${t('Total')}: ${M(sTot(s))}</b><br>${t('Paid')}: ${M(s.paid)} · ${t('Due')}: ${M(sTot(s)-s.paid)}</p><div class="row no"><button class="b2" onclick="cm()">${t('Cancel')}</button><button onclick="print()">${t('Print')}</button></div>`)}

async function img(f,sz){if(!f)return'';const u=URL.createObjectURL(f),i=new Image();await new Promise(r=>{i.onload=r;i.src=u});const c=document.createElement('canvas'),s=Math.min(1,sz/Math.max(i.width,i.height));c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.6)}

// REPORTS
function range(){const d=today();return per=='today'?[d,d]:per=='week'?[ds(6),d]:per=='month'?[d.slice(0,8)+'01',d]:per=='year'?[d.slice(0,5)+'01-01',d]:[rf||'0000',rt||'9999']}
function rep(){const[f,to]=range(),s=stat(f,to),o=S.o.filter(x=>ok(x)&&x.date>=f&&x.date<=to),pr={};o.forEach(x=>x.it.forEach(i=>{const p=pr[i.pid]=pr[i.pid]||{q:0,r:0,c:0};p.q+=i.q;p.r+=i.q*i.pr;p.c+=i.q*i.cs}));
const b=bal(),iv=inv(),ar=sum(S.c,cDue),ap=sum(S.sup,sDue),cap=sum(S.cap,c=>c.a),as=b.cash+b.bank+iv+ar;
const row=(l,v,c)=>`<tr><td>${t(l)}</td><td style="text-align:right" class="${c||''}">${M(v)}</td></tr>`;
const cf=sum(S.o.filter(x=>x.date>=f&&x.date<=to&&ok(x)),x=>x.paid)+sum(S.col.filter(x=>x.date>=f&&x.date<=to),x=>x.a),co=sum(S.pu.filter(x=>x.date>=f&&x.date<=to),x=>x.paid)+sum(S.sp.filter(x=>x.date>=f&&x.date<=to),x=>x.a)+s.ex;
return`<h1>${t('Reports')}<button class="b2" onclick="csv()">${t('Export CSV')}</button></h1><div class="row"><select onchange="per=this.value;render()">${['today','week','month','year','custom'].map(p=>`<option value="${p}" ${p==per?'selected':''}>${t({today:'Today',week:'Week',month:'Month',year:'Year',custom:'From'}[p])}</option>`).join('')}</select>${per=='custom'?`<input type="date" value="${rf}" onchange="rf=this.value;render()"><input type="date" value="${rt}" onchange="rt=this.value;render()">`:''}</div>
<div class="c"><table>${row('Revenue',s.rev)}${row('COGS',-s.cogs)}${row('Gross profit',s.gp)}${row('Operating',-s.ex)}${row('Net profit',s.net,s.net<0?'neg':'pos')}${row('Cash in hand',cf-co)}</table></div>
<h3>${t('Expense categories')}</h3><div class="c"><table>${CAT.map(k=>[k,sum(s.e.filter(e=>e.cat==k),e=>e.a)]).filter(x=>x[1]).map(x=>row(x[0],x[1])).join('')}</table></div>
<h3>${t('Product profit')}</h3>${tbl(['Product','Qty','Revenue','Profit'],Object.keys(pr).map(id=>`<tr><td>${esc(prod(id)?.n||'-')}</td><td>${N(pr[id].q)}</td><td>${M(pr[id].r)}</td><td>${M(pr[id].r-pr[id].c)}</td></tr>`))}
<h3>${t('Balance sheet')}</h3><div class="c"><table>${row('Cash in hand',b.cash)}${row('Bank',b.bank)}${row('Inventory',iv)}${row('Receivable',ar)}${row('Assets',as,'pos')}${row('Payable',ap)}${row('Equity',as-ap,'pos')}${row('Capital',cap)}${row('Retained profit',as-ap-cap)}</table></div>
<h3>${t('Customer due')}</h3>${tbl(['Name','Due'],S.c.filter(c=>cDue(c)>0).map(c=>`<tr><td>${esc(c.n)}</td><td>${M(cDue(c))}</td></tr>`))}<h3>${t('Supplier due')}</h3>${tbl(['Name','Due'],S.sup.filter(c=>sDue(c)>0).map(c=>`<tr><td>${esc(c.n)}</td><td>${M(sDue(c))}</td></tr>`))}<div class="row no" style="margin-top:12px"><button class="b2" onclick="print()">${t('Print')} / PDF</button></div>`}
async function dl(name,text,type){const d=await claude.use('downloads');if(!d)return toast('Download unavailable here');try{await d.save({filename:name,data:new Blob([text],{type})})}catch(e){if(e&&e.code!='declined')toast('Download failed')}}
const cs=a=>a.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n');
function csv(){const[f,to]=range(),s=stat(f,to);dl('report.csv','\ufeff'+cs([['Date','Order','Customer','Total','COGS','Paid','Status'],...S.o.filter(x=>x.date>=f&&x.date<=to).map(x=>[x.date,x.no,cust(x.cid).n,sTot(x),sCogs(x),x.paid,x.st]),[],['Revenue',s.rev],['COGS',s.cogs],['Expenses',s.ex],['Net profit',s.net]]),'text/csv')}
// SETTINGS
function set(){const s=S.set;return`<h1>${t('Settings')}</h1><div class="c">${inp('bn','Business name',{v:s.name})}${inp('ad','Address',{v:s.ad})}${inp('ph','Phone',{v:s.ph})}${inp('lw','Min stock',{t:'number',v:s.low})}<div class="row">${sel('lg','Language',['bn','en'],s.lang)}${sel('th','Theme',['Auto','Light','Dark'],s.theme?s.theme[0].toUpperCase()+s.theme.slice(1):'Auto')}</div><button style="margin-top:8px" onclick="Object.assign(S.set,{name:g('bn'),ad:g('ad'),ph:g('ph'),low:gn('lw'),lang:g('lg'),theme:g('th')=='Auto'?'':g('th').toLowerCase()});save();render();toast(t('Saved'))">${t('Save')}</button></div>
<h3>Steadfast Courier</h3><div class="c"><p>Courier বুকিং/Tracking মডিউল ব্যবহার করতে নিচের Courier ট্যাবে যাও। বাস্তব API চালাতে Secure Backend দরকার; API secret এখানে সংরক্ষণ করা হয় না।</p><button class="b2" onclick="go('courier')">Open Courier Management</button></div><h3>${t('Backup')}</h3><div class="c row"><button onclick="dl('hisab-backup.json',JSON.stringify(S),'application/json')">${t('Backup')}</button><label style="margin:0">${t('Restore')}<input type="file" accept=".json" onchange="restore(this.files[0])"></label></div>`}
async function restore(f){try{const d=JSON.parse(await f.text());if(!d.o||!d.p)throw 0;S=d;save();render();toast(t('Saved'))}catch(e){toast('Invalid file')}}
render();initCloud();
</script></body></html>
